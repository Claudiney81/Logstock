services:
  - type: web
    name: logistock-homologacao
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 run:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: logistock-homologacao-db
          property: connectionString
      - key: LOGISTOCK_ADMIN_NAME
        value: Administrador QA
      - key: LOGISTOCK_ADMIN_EMAIL
        sync: false
      - key: LOGISTOCK_ADMIN_PASSWORD
        sync: false

databases:
  - name: logistock-homologacao-db
    plan: free
    databaseName: logistock_qa
    user: logistock_qa
    ipAllowList: []
